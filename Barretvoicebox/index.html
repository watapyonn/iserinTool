<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>バレット ボイスBOX アルティメット</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ポータルへ戻るナビゲーションバー -->
    <div class="nav-bar">
        <a href="../index.html" class="back-btn">
            <span>◀</span>
            <span>ポータルメニューに戻る</span>
        </a>
        <span class="nav-tag">ISERITOOL HUB / FFVII</span>
    </div>

    <!-- メインウィンドウ -->
    <div class="ff7-window" id="main-window">
        <!-- ヘッダー部分 -->
        <div class="barret-header">
            <!-- バレットアイコン -->
            <div class="portrait-wrapper">
                <div id="portrait-container" class="portrait-box" title="クリックで画像切り替え" onclick="cycleIcon()">
                    <img id="portrait-img" src="" alt="Barret Icon" style="display: none;" onerror="this.style.display='none'; document.getElementById('portrait-svg').style.display='block';">
                    <svg id="portrait-svg" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #9ca3af;">
                        <circle cx="12" cy="8" r="5"></circle>
                        <path d="M3 21v-2a7 7 0 0 1 7-7h4a7 7 0 0 1 7 7v2"></path>
                        <line x1="21" y1="12" x2="21" y2="21" stroke-width="4" stroke="gray"></line>
                    </svg>
                    <div class="portrait-hover-hint">
                        <span>CHANGE<br>ICON</span>
                    </div>
                </div>
                <div class="portrait-tip">TAP TO CHANGE</div>
            </div>
            
            <!-- ステータス情報 -->
            <div class="status-info">
                <div class="status-title-row">
                    <h1 class="char-name">BARRET WALLACE <span class="char-name-sub">Ultimate</span></h1>
                    <span class="char-level">LV 99</span>
                </div>
                <div class="stats-row">
                    <div><span class="stat-label">HP</span> <span>9999</span>/9999</div>
                    <div><span class="stat-label">MP</span> <span>250</span>/250</div>
                    <div class="stat-total">TOTAL: 100 VOICES</div>
                </div>
                <div class="status-message-box">
                    <p class="status-message" id="status-text">▶ SELECT VOICE</p>
                </div>
            </div>
        </div>

        <!-- ボイスリスト表示エリア -->
        <div class="voice-scroll-area" id="scroll-area">
            <div class="voice-grid" id="voice-list-container">
                <!-- JavaScriptで動的にボタンが生成されます -->
            </div>
        </div>

        <!-- ページネーション -->
        <div class="pagination-area">
            <div class="pagination-controls" id="pagination-container">
                <!-- JavaScriptで動的に生成されます -->
            </div>
            <div class="pagination-note">
                ※音声はブラウザの合成音声です。デバイスの音量を上げてお楽しみください。
            </div>
        </div>
    </div>

    <!-- 外部スクリプトの読み込み -->
    <script src="js/voices.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
