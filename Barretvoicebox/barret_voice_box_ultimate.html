<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バレット ボイスBOX アルティメット</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="p-2 sm:p-4 w-full">
    <!-- ポータルへ戻るナビゲーションバー -->
    <div class="max-w-5xl mx-auto mb-2 flex items-center justify-between">
        <a href="../index.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded bg-blue-950/80 hover:bg-blue-900 border border-blue-400/50 text-cyan-300 hover:text-white text-xs sm:text-sm font-bold shadow transition-all duration-200">
            <span>◀</span>
            <span>ポータルメニューに戻る</span>
        </a>
        <span class="text-xs text-gray-400 font-mono">ISERITOOL HUB / FFVII</span>
    </div>

    <div class="ff7-window w-full max-w-5xl mx-auto p-4 sm:p-6 flex flex-col h-[calc(95vh-35px)]" id="main-window">
        <!-- ヘッダー部分 -->
        <div class="flex flex-col sm:flex-row items-center border-b-2 border-gray-400 pb-4 gap-6 shrink-0">
            <!-- バレットのアイコン (画像切り替え機能付き) -->
            <div class="flex flex-col items-center gap-2">
                <div id="portrait-container" class="w-20 h-20 sm:w-28 sm:h-28 bg-black border-2 border-gray-400 rounded flex items-center justify-center flex-shrink-0 transition-all duration-300 shadow-lg overflow-hidden cursor-pointer relative group" title="クリックで画像切り替え" onclick="cycleIcon()">
                    <!-- 画像表示用の要素 -->
                    <img id="portrait-img" src="" alt="Barret Icon" class="w-full h-full object-cover hidden" onerror="this.style.display='none'; document.getElementById('portrait-svg').style.display='block';">
                    
                    <!-- 画像が読み込めなかった場合や未設定時のSVGフォールバック -->
                    <svg id="portrait-svg" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
                        <circle cx="12" cy="8" r="5"></circle>
                        <path d="M3 21v-2a7 7 0 0 1 7-7h4a7 7 0 0 1 7 7v2"></path>
                        <line x1="21" y1="12" x2="21" y2="21" stroke-width="4" stroke="gray"></line>
                    </svg>

                    <!-- ホバー時のヒント -->
                    <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <span class="text-xs text-white text-center">CHANGE<br>ICON</span>
                    </div>
                </div>
                <div class="text-[10px] text-gray-400 tracking-wider">CLICK TO CHANGE</div>
            </div>
            
            <div class="flex-grow text-center sm:text-left w-full">
                <div class="flex justify-between items-end mb-2 border-b border-gray-600 pb-1">
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-widest text-white">BARRET WALLACE <span class="text-sm text-gray-400">Ultimate Edition</span></h1>
                    <span class="text-lg text-yellow-300 hidden sm:inline">LV 99</span>
                </div>
                <div class="flex gap-6 text-base sm:text-lg">
                    <div><span class="text-gray-400">HP</span> <span class="text-white">9999</span> / 9999</div>
                    <div><span class="text-gray-400">MP</span> <span class="text-white">250</span> / 250</div>
                    <div class="ml-auto hidden md:block text-gray-300">TOTAL: 100 VOICES</div>
                </div>
                <div class="mt-2 h-6 overflow-hidden">
                    <p class="text-base text-yellow-300 transition-all" id="status-text">▶ SELECT VOICE</p>
                </div>
            </div>
        </div>

        <!-- ボイスリスト表示エリア (スクロール可能) -->
        <div class="flex-grow overflow-y-auto my-4 pr-2" id="scroll-area">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2" id="voice-list-container">
                <!-- JavaScriptで動的にボタンが生成されます -->
            </div>
        </div>

        <!-- ページネーション（ページ切り替え） -->
        <div class="shrink-0 flex flex-col items-center gap-2 border-t-2 border-gray-400 pt-3">
            <div class="flex flex-wrap justify-center gap-1 sm:gap-2 w-full" id="pagination-container">
                <!-- JavaScriptで動的に生成されます -->
            </div>
            <div class="text-center text-xs text-gray-400 mt-1">
                ※音声はブラウザの合成音声です。デバイスの音量を上げてお楽しみください。
            </div>
        </div>
    </div>

    <!-- 外部スクリプトの読み込み -->
    <script src="js/voices.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
